<!-- Refactored NPS component template - improved structure, accessibility, and maintainability -->
<style>
  /* Local styles kept inside template for portability; consider moving to component stylesheet */
  .nps-container { margin-left: 1%; margin-top: 1%; }
  .nps-controls { display: flex; align-items: center; gap: 1rem; }
  .calendar-second { margin-left: 1%; }
  .nps-table-wrapper { margin-top: 1%; margin-left: 1%; }
  .nps-table { background-color: gray; border-collapse: collapse; }
  .nps-table th, .nps-table td { border: 1px solid #000; padding: 0.25rem 0.5rem; text-align: left; }
  .nps-result { font-weight: 600; }
</style>

<div class="nps-container">
  <!-- Filter form: pressing Enter will also trigger filtro() because of form submit -->
  <form class="nps-controls" (ngSubmit)="filtro()" role="form" aria-label="NPS filters">
    <p-calendar
      placeholder="Data Inicial"
      id="dataInicial"
      name="dataInicial"
      [(ngModel)]="dataInicial"
      appendToBody
      [showIcon]="true"
      aria-label="Data Inicial">
    </p-calendar>

    <p-calendar
      class="calendar-second"
      placeholder="Data Final"
      id="dataFinal"
      name="dataFinal"
      [(ngModel)]="dataFinal"
      appendToBody
      [showIcon]="true"
      aria-label="Data Final">
    </p-calendar>

    <!--
      Authorization hint: to restrict access to filtering in the UI, wire authService.hasRole('Analyst') or similar on the disabled binding.
      Example (keeps default behavior if authService is not provided):
        [disabled]="authService ? !authService.hasRole('Analyst') : false"
    -->
    <p-button
      type="submit"
      label="Filtrar"
      aria-label="Filtrar"
      [disabled]="authService ? !authService.hasRole('Analyst') : false">
    </p-button>
  </form>

  <div class="nps-table-wrapper" role="region" aria-label="NPS results">
    <table class="nps-table" role="table" aria-describedby="nps-summary">
      <caption id="nps-summary" class="sr-only">Resumo NPS</caption>
      <thead>
        <tr>
          <th scope="col">Participantes</th>
          <th scope="col">Qtd</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Promotores</td>
          <td>{{ promotor }}</td>
        </tr>
        <tr>
          <td>Neutros</td>
          <td>{{ neutro }}</td>
        </tr>
        <tr>
          <td>Detratores</td>
          <td>{{ detrator }}</td>
        </tr>
        <tr>
          <td>Total</td>
          <td>{{ total }}</td>
        </tr>
        <tr>
          <td>NPS</td>
          <td class="nps-result"><span [style.color]="color">{{ result }}</span></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
