<style>
  .av-header-actions {
    margin-left: 90%;
    margin-top: 1%;
  }

  .av-list {
    margin-top: 1%;
  }

  .av-dialog-width {
    width: 50%;
  }

  .av-field-spacing {
    margin-top: 1%;
  }

  .av-textarea {
    margin-top: 1%;
  }
</style>

<div class="av-header-actions">
  <!-- Add button kept as-is for backward compatibility with existing component logic -->
  <p-button
    icon="pi pi-user-plus"
    aria-label="Adicionar avaliação"
    (click)="openAvaliacao()"
  ></p-button>
</div>

<div class="av-list">
  <p-table [value]="avaliacoes" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Cliente</th>
        <th>Nota</th>
        <th>Motivo</th>
        <th>Data Avaliação</th>
      </tr>
    </ng-template>

    <!-- Use a singular template variable name for clarity -->
    <ng-template pTemplate="body" let-avaliacao>
      <tr>
        <td>{{ avaliacao.client }}</td>
        <td>{{ avaliacao.nota }}</td>
        <td>{{ avaliacao.motivo }}</td>
        <td>{{ avaliacao.dataAvaliacao }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [(visible)]="avaliacaoDialog"
  [style]="{ width: '50%'}"
  header="Nova Avaliação"
  [modal]="true"
  styleClass="p-fluid"
  class="av-dialog-width"
>
  <!--
    Important: form preserves original attributes (action/method) so behavior is unchanged.
    Extra data attributes are added to mark this form as protected for backend auth/authorization
    integrations (JWT/cookie role checks). These are metadata only and do not change client behavior.
  -->
  <form
    action="/pagina-processa-dados-do-form"
    appendTo="body"
    [formGroup]="form"
    method="post"
    data-protected-endpoint="/api/avaliacoes"
    data-protected-method="POST"
    data-requires-auth="true"
  >
    <p-dropdown
      [options]="clientes"
      formControlName="client"
      appendTo="body"
      optionLabel="nameClient"
      placeholder="Selecione um Cliente"
      value="id"
      aria-label="Selecionar cliente"
    ></p-dropdown>

    <div class="av-field-spacing">
      <p>
        Em uma escala de 0 a 10, qual a probabilidade de você recomendar nosso produto/serviço a um
        amigo/conhecido?
      </p>
      <p-inputNumber formControlName="nota" [min]="0" [max]="10" [showButtons]="true" aria-label="Nota">
      </p-inputNumber>
    </div>

    <textarea
      class="av-textarea"
      formControlName="motivo"
      placeholder="Qual é o motivo dessa nota?"
      pInputTextarea
      rows="3"
      cols="20"
      aria-label="Motivo da avaliação"
    ></textarea>
  </form>

  <!-- Kept original click handler to preserve exact behavior -->
  <p-button
    label="Submit"
    (click)="postAvaliacao()"
    type="button"
    aria-label="Enviar avaliação"
    data-action="submit-avaliacao"
    data-requires-role="ROLE_USER"
  ></p-button>
</p-dialog>
