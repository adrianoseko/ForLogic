  - Move inline styles into the component stylesheet (frontend/src/app/app-template/components/users/users.component.scss)
    and define classes: .users-actions { display:flex; justify-content:flex-end; margin-top:1%; } and
    .users-table { margin-top:1%; }
  - Authentication & authorization (frontend):
      * Provide an AuthService exposing observables/methods like isAuthenticated$, user$, hasRole(role: string).
      * Use structural directives in the component template (e.g. *ngIf="authService.hasRole('Admin')") to
        control visibility of actions (Add user button).

<div class="users-actions" role="toolbar" aria-label="Ações de usuários">
  <!-- Add button: keep as-is visually but wire to a click handler in the component when needed -->
  <p-button
    icon="pi pi-user-plus"
    title="Adicionar usuário"
    aria-label="Adicionar usuário">
  </p-button>
</div>

<div class="users-table" aria-live="polite">
  <p-table
    [value]="users"
    [tableStyle]="{ 'min-width': '50rem' }"
    aria-label="Tabela de usuários">

    <ng-template pTemplate="header">
      <tr>
        <th scope="col">Usuário</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.login }}</td>
      </tr>
    </ng-template>

  </p-table>
</div>
